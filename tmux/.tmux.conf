# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# General
set -g mouse on
set -g window-size latest
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 0

# Split panes (stay in current path)
unbind %
unbind '"'
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"

# Pane navigation (vim-style)
bind -r C-h select-pane -L
bind -r C-j select-pane -D
bind -r C-k select-pane -U
bind -r C-l select-pane -R

# Pane resize (vim-style, repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Pane zoom / close
bind z resize-pane -Z
bind x kill-pane

# Windows
bind c new-window -c "#{pane_current_path}"
bind , command-prompt -I "#{window_name}" "rename-window '%%'"
bind -r n next-window
bind -r p previous-window
bind w choose-tree -Zw

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Copy mode (vi keys + Mac clipboard)
setw -g mode-keys vi
bind [ copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel

# Status bar
set -g status-position top
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left "#[fg=#89b4fa,bold] #S  "
set -g status-right "#[fg=#a6adc8] %H:%M  %d %b "
set -g status-left-length 30
setw -g window-status-format "#[fg=#585b70] #I:#W "
setw -g window-status-current-format "#[fg=#89b4fa,bold] #I:#W "
