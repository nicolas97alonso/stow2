"$schema" = 'https://starship.rs/config-schema.json'

# Based on Omarchy's official config/starship.toml, with four deviations:
# a two-line prompt, a right-aligned clock, a non-cyan git branch, and
# distinct colors for character/git_status instead of Omarchy's shared cyan.
#
# Every style here is a **named ANSI color**, never a hex. Starship resolves
# these against the terminal's live palette, so the prompt re-themes itself off
# ghostty's `palette = 0..15` whenever the theme changes -- pinning hexes here
# would mean hand-editing this file on every theme switch.
#
# TRAP, measured: starship **silently ignores** color names it doesn't know --
# no error, no warning, the text just renders unstyled. The magenta slot is
# spelled `purple` (NOT `magenta`) and bright variants are hyphenated
# (`bright-purple`, NOT `bright_purple`). Both wrong spellings emit zero escape
# codes. Verify any color change with `starship explain`, which prints the
# resolved codes -- `1;36` = bold cyan, `3;33` = italic yellow, `35` = purple,
# `1;32` = bold green, `1;31` = bold red, `34` = blue.
add_newline = true
command_timeout = 200

# Two lines: context on top, a bare prompt character below.
#
# `$fill` is what right-aligns the clock, and it has to be `$fill` rather than a
# `right_format` entry. Starship's own docs are explicit that the right prompt
# is "a single line following the input location" -- i.e. `right_format` in zsh
# is RPROMPT and lands next to where you type, on line 2, not out at the right
# of the context line. `fill` is the documented way to right-align something
# *above* the input line. Don't "simplify" this into right_format.
format = "$directory$git_branch$git_status$fill$time$line_break$character"

[character]
error_symbol = "[✗](bold red)"
success_symbol = "[❯](bold green)"

[directory]
truncation_length = 1
truncation_symbol = ""
repo_root_style = "bold cyan"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
# Yellow (#c0a36e, 7.1:1 on the #1D1C19 background), not the cyan everything
# else uses: ~124 deg of hue separation from `directory`, so the two read as
# distinct at a glance. Italic is kept as a second, non-color differentiator.
style = "italic yellow"
# Load-bearing for the clock, not cosmetic. `fill` clamps to a 2-space minimum
# and starship never reflows on overflow, so with a full-length branch name --
# feature/IPMS-6912_fix_high_vulnerabilities_dbt_runtime_api is 58 chars -- the
# line ran 2 cols past an 80-col terminal and soft-wrapped the clock down onto
# the `❯` line (measured with `starship prompt -w 80`). 45 leaves `fill` at
# double digits of slack at that width, well clear of the wrap point, while
# showing the whole "vulnerabilities" segment instead of just the ticket id.
truncation_length = 45
truncation_symbol = "…"

[git_status]
format     = '[$all_status]($style)'
# Blue (#7e9cd8, 6.2:1 on #1D1C19) -- was cyan, which is the same color as
# `directory`'s default style and made the up_to_date dot blend into the path.
style      = "blue"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""

# A literal space, overriding the default `.` -- the padding has to be
# invisible. `style` is left alone because a space renders nothing regardless.
[fill]
symbol = " "

# Disabled by default, hence the explicit false. Default time_format is %T
# (with seconds); %R is bare HH:MM.
[time]
disabled = false
format = "[$time]($style)"
time_format = "%R"
# Purple #957fb8 at 4.87:1 -- readable but low-saturation, so it reads as a quiet
# lavender rather than a third competing accent. `bright-black` (#54546d, 2.33:1)
# is the swap if this still pulls too much focus.
style = "purple"
